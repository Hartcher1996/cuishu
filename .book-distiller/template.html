<body>
<button class="menu-btn" id="menuBtn" aria-label="菜单">
  <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="overlay" id="overlay"></div>
<div class="layout">
  <aside class="toc" id="toc">
    <div class="toc-header">
      <h1><!-- 书名 --></h1>
      <div class="subtitle"><!-- 作者 · 精华蒸馏版 --></div>
    </div>
    <ul>
      <!-- TOC 由蒸馏内容自动生成 -->
    </ul>
  </aside>
  <main class="main">
    <div class="content">
      <section class="hero" id="top">
        <svg class="icon hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <h1><!-- 书名 --></h1>
        <div class="author"><!-- 作者 --></div>
        <p class="tagline"><!-- 一句话定位 --></p>
      </section>

      <!-- ======== 蒸馏内容填充区 ======== -->
      <!-- 按章节填充 <section id="xxx"> 块 -->

      <footer class="book-footer">— 蒸馏自 <!-- 书名 --> —</footer>
    </div>
  </main>
</div>
<script>
  const sections = document.querySelectorAll('section[id]');
  const tocLinks = document.querySelectorAll('.toc a');
  function setActiveLink() {
    let current = '';
    const scrollPos = window.scrollY + 120;
    sections.forEach(section => {
      const top = section.getBoundingClientRect().top + window.scrollY;
      if (scrollPos >= top) current = section.getAttribute('id');
    });
    tocLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href').substring(1) === current) link.classList.add('active');
    });
  }
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => { setActiveLink(); ticking = false; });
      ticking = true;
    }
  });
  setActiveLink();
  const menuBtn = document.getElementById('menuBtn');
  const toc = document.getElementById('toc');
  const overlay = document.getElementById('overlay');
  function toggleMenu(show) {
    if (show) { toc.classList.add('open'); overlay.classList.add('show'); }
    else { toc.classList.remove('open'); overlay.classList.remove('show'); }
  }
  menuBtn.addEventListener('click', () => toggleMenu(!toc.classList.contains('open')));
  overlay.addEventListener('click', () => toggleMenu(false));
  tocLinks.forEach(link => {
    link.addEventListener('click', () => { if (window.innerWidth <= 960) toggleMenu(false); });
  });
</script>
